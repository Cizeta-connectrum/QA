name: 本棚を公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: 本棚を組み立てる
        env:
          READER_PATH: ${{ secrets.READER_PATH }}
        run: |
          if ! [[ "$READER_PATH" =~ ^[A-Za-z0-9_-]{16,}$ ]]; then
            echo "::error::リポジトリのシークレット READER_PATH（16文字以上の英数字）を設定してください。README を参照。"
            exit 1
          fi
          mkdir -p _site
          python scripts/build.py "_site/$READER_PATH"
          # 秘密のURL以外では何も見せない
          printf '<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>Not Found</title>\n' > _site/index.html
          cp _site/index.html _site/404.html
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
