<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>本棚</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="本棚">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17171a" media="(prefers-color-scheme: dark)">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
<style>
  :root {
    --bg: #f6f4ef; --surface: #ffffff; --text: #23211d; --muted: #77726a;
    --line: #e4e0d7; --accent: #8a5a2b; --accent-soft: #f1e6d8; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.06);
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17171a; --surface: #222226; --text: #e8e6e1; --muted: #9b978f; --line: #34343a; --accent: #d9a46c; --accent-soft: #3a2f24; --shadow: 0 1px 2px rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif; }
  body.reading { overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  .hidden { display: none !important; }

  /* ---------- 本棚 ---------- */
  #shelf { max-width: 1100px; margin: 0 auto; padding: calc(16px + var(--safe-top)) 16px calc(32px + var(--safe-bottom)); }
  .shelf-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .shelf-head h1 { font-size: 22px; margin: 0; flex: 1; letter-spacing: .02em; }
  .icon-btn { width: 40px; height: 40px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .icon-btn:hover { background: var(--accent-soft); }
  .icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #search { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 16px; margin-bottom: 18px; }
  #search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .section-title { font-size: 13px; color: var(--muted); margin: 22px 0 10px; font-weight: 600; }
  .section-title:first-child { margin-top: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 22px 16px; }
  @media (max-width: 420px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 18px 12px; } }
  .book { text-align: left; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .cover { aspect-ratio: 2 / 3; width: 100%; border-radius: 3px 7px 7px 3px; overflow: hidden; box-shadow: var(--shadow); position: relative; background: var(--surface); transition: transform .15s; }
  .book:hover .cover { transform: translateY(-2px); }
  .book:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover .gen { position: absolute; inset: 0; padding: 14% 11%; display: flex; flex-direction: column; justify-content: space-between; color: #fff; }
  .cover .gen b { font-size: 13px; line-height: 1.45; word-break: break-all; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
  .cover .gen span { font-size: 10px; opacity: .85; }
  .cover .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(0,0,0,.28); }
  .cover .bar i { display: block; height: 100%; background: #e0a868; }
  .book .t { font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
  .book .a { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -4px; }
  .center-msg { text-align: center; color: var(--muted); padding: 60px 16px; line-height: 1.8; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 読書画面 ---------- */
  #reader { position: fixed; inset: 0; background: var(--rbg); color: var(--rfg); display: flex; flex-direction: column; }
  #reader[data-theme="light"] { --rbg: #ffffff; --rfg: #222222; --rmuted: #8a8a8a; --rline: #ececec; --rpanel: #ffffff; }
  #reader[data-theme="sepia"] { --rbg: #f5ecd9; --rfg: #3b3024; --rmuted: #8c7b64; --rline: #e3d6bb; --rpanel: #fbf4e6; }
  #reader[data-theme="dark"]  { --rbg: #18181a; --rfg: #d8d5cf; --rmuted: #85827c; --rline: #2c2c30; --rpanel: #232326; }
  .r-top { height: calc(48px + var(--safe-top)); padding: var(--safe-top) 6px 0; display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .r-top .title { flex: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; color: var(--rmuted); }
  .r-top .icon-btn:hover { background: var(--rline); }
  #viewer-wrap { flex: 1; position: relative; min-height: 0; }
  #viewer { position: absolute; inset: 0 10px; }
  .r-bottom { padding: 8px 18px calc(10px + var(--safe-bottom)); display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--rmuted); flex-shrink: 0; }
  .r-bottom .chap { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #slider { flex: 1.3; accent-color: var(--accent); min-width: 60px; margin: 0; }
  #pct { min-width: 3em; text-align: right; font-variant-numeric: tabular-nums; }
  .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 36px; height: 72px; display: none; align-items: center; justify-content: center; color: var(--rmuted); z-index: 2; opacity: .45; }
  .nav-arrow:hover { opacity: 1; }
  .nav-arrow svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }
  @media (hover: hover) and (min-width: 700px) { .nav-arrow { display: flex; } #viewer { inset: 0 44px; } }
  #prev-btn { left: 4px; } #next-btn { right: 4px; }
  #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: var(--rbg); z-index: 5; color: var(--rmuted); font-size: 14px; }
  #loading .spinner { border-color: var(--rline); border-top-color: var(--accent); }
  .progress-track { width: 180px; height: 4px; background: var(--rline); border-radius: 2px; overflow: hidden; margin-top: 8px; }
  .progress-track i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  /* パネル（目次・設定） */
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.35); z-index: 10; }
  .panel { position: absolute; z-index: 11; background: var(--rpanel); color: var(--rfg); box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  #toc-panel { top: 0; bottom: 0; left: 0; width: min(340px, 86vw); padding-top: var(--safe-top); display: flex; flex-direction: column; }
  .panel h2 { font-size: 15px; margin: 0; padding: 16px 18px 10px; }
  #toc-list { overflow-y: auto; flex: 1; padding: 0 8px calc(16px + var(--safe-bottom)); }
  #toc-list button { display: block; width: 100%; text-align: left; padding: 10px; border-radius: 8px; font-size: 14px; line-height: 1.45; }
  #toc-list button:hover { background: var(--rline); }
  #toc-list button.current { color: var(--accent); font-weight: 600; }
  #settings-panel { top: calc(52px + var(--safe-top)); right: 10px; width: min(330px, calc(100vw - 20px)); border-radius: 14px; padding-bottom: 14px; }
  .row { padding: 8px 18px; display: flex; align-items: center; gap: 10px; }
  .row label { font-size: 13px; color: var(--rmuted); width: 5.6em; flex-shrink: 0; white-space: nowrap; }
  .seg { display: flex; flex: 1; border: 1px solid var(--rline); border-radius: 9px; overflow: hidden; }
  .seg button { flex: 1; padding: 8px 2px; font-size: 13px; white-space: nowrap; }
  .seg button + button { border-left: 1px solid var(--rline); }
  .seg button.on { background: var(--accent); color: #fff; }
  .size-val { flex: 1; text-align: center; font-size: 14px; font-variant-numeric: tabular-nums; }
  .seg .swatch[data-t="light"] { background: #fff; color: #222; }
  .seg .swatch[data-t="sepia"] { background: #f5ecd9; color: #3b3024; }
  .seg .swatch[data-t="dark"] { background: #18181a; color: #d8d5cf; }
  .seg .swatch.on { box-shadow: inset 0 0 0 3px var(--accent); font-weight: 600; }
  #toast { position: fixed; left: 50%; bottom: calc(24px + var(--safe-bottom)); transform: translateX(-50%); background: rgba(30,30,30,.92); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 50; max-width: calc(100vw - 32px); }
</style>
</head>
<body>

<!-- 本棚 -->
<div id="shelf">
  <div class="shelf-head">
    <h1>本棚</h1>
    <button class="icon-btn" id="refresh-btn" title="再読み込み" aria-label="再読み込み">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
  <input id="search" type="search" placeholder="本を探す（タイトル・著者）" class="hidden" autocomplete="off">
  <div id="shelf-body"><div class="center-msg"><div class="spinner"></div>本棚を読み込んでいます…</div></div>
</div>

<!-- 読書画面 -->
<div id="reader" class="hidden" data-theme="light">
  <div class="r-top">
    <button class="icon-btn" id="back-btn" title="本棚に戻る" aria-label="本棚に戻る">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="icon-btn" id="toc-btn" title="目次" aria-label="目次">
      <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
    </button>
    <div class="title" id="r-title"></div>
    <button class="icon-btn" id="settings-btn" title="表示設定" aria-label="表示設定">
      <svg viewBox="0 0 24 24"><path d="M4 20l5-14h2l5 14M6.5 14h7"/><path d="M17 20l2.5-7h1l2.5 7M17.8 18h4.4" stroke-width="1.6"/></svg>
    </button>
  </div>
  <div id="viewer-wrap">
    <div id="viewer"></div>
    <button class="nav-arrow" id="prev-btn" aria-label="前のページ"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="nav-arrow" id="next-btn" aria-label="次のページ"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    <div id="loading"><div class="spinner"></div><div id="loading-text">本を開いています…</div><div class="progress-track"><i id="loading-bar"></i></div></div>
  </div>
  <div class="r-bottom">
    <div class="chap" id="chap"></div>
    <input type="range" id="slider" min="0" max="1000" value="0" disabled aria-label="読む位置">
    <div id="pct"></div>
  </div>

  <div class="scrim hidden" id="scrim"></div>
  <div class="panel hidden" id="toc-panel">
    <h2>目次</h2>
    <div id="toc-list"></div>
  </div>
  <div class="panel hidden" id="settings-panel">
    <h2>表示設定</h2>
    <div class="row"><label>文字サイズ</label>
      <div class="seg"><button id="font-down" aria-label="文字を小さく">A−</button></div>
      <div class="size-val" id="font-val">100%</div>
      <div class="seg"><button id="font-up" aria-label="文字を大きく">A＋</button></div>
    </div>
    <div class="row"><label>書体</label>
      <div class="seg" id="family-seg">
        <button data-v="book">本の指定</button><button data-v="gothic">ゴシック</button><button data-v="mincho">明朝</button>
      </div>
    </div>
    <div class="row"><label>行間</label>
      <div class="seg" id="lh-seg">
        <button data-v="">本の指定</button><button data-v="1.9">広め</button><button data-v="2.2">最大</button>
      </div>
    </div>
    <div class="row"><label>背景</label>
      <div class="seg" id="theme-seg">
        <button class="swatch" data-t="light">白</button><button class="swatch" data-t="sepia">セピア</button><button class="swatch" data-t="dark">黒</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="hidden" role="status"></div>

<script>
(function () {
  'use strict';

  // ---------- 端末に保存（読んだ位置・設定） ----------
  var store = {
    get: function (k, def) { try { var v = localStorage.getItem('shelf:' + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
    set: function (k, v) { try { localStorage.setItem('shelf:' + k, JSON.stringify(v)); } catch (e) {} }
  };

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var toastTimer;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.add('hidden'); }, 4000);
  }

  // ---------- 本棚 ----------
  var books = [];
  function byId(id) { for (var i = 0; i < books.length; i++) if (books[i].id === id) return books[i]; return null; }
  function titleOf(b) { return b.title || b.name; }
  function hashHue(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h % 360; }

  function card(b) {
    var prog = store.get('pos:' + b.id);
    var bar = prog && prog.pct > 0.005 ? '<div class="bar"><i style="width:' + Math.max(2, Math.round(prog.pct * 100)) + '%"></i></div>' : '';
    var cover;
    if (b.cover) {
      cover = '<img src="' + esc(b.cover) + '" alt="" loading="lazy">';
    } else {
      var hue = hashHue(b.name);
      cover = '<div class="gen" style="background:linear-gradient(160deg,hsl(' + hue + ',36%,42%),hsl(' + ((hue + 30) % 360) + ',40%,27%))">' +
        '<b>' + esc(titleOf(b)) + '</b><span>' + esc(b.author) + '</span></div>';
    }
    return '<button class="book" data-id="' + esc(b.id) + '"><div class="cover">' + cover + bar + '</div>' +
      '<div class="t">' + esc(titleOf(b)) + '</div>' + (b.author ? '<div class="a">' + esc(b.author) + '</div>' : '') + '</button>';
  }

  function renderShelf() {
    var q = $('search').value.trim().toLowerCase();
    var body = $('shelf-body');
    if (!books.length) {
      body.innerHTML = '<div class="center-msg">まだ本がありません。<br>GitHubの <b>books</b> フォルダに .epub ファイルを入れると、数分でここに並びます。</div>';
      return;
    }
    var list = books.filter(function (b) {
      return !q || (b.name + ' ' + b.title + ' ' + b.author + ' ' + b.folder).toLowerCase().indexOf(q) >= 0;
    });
    if (!list.length) { body.innerHTML = '<div class="center-msg">「' + esc(q) + '」に合う本はありません。</div>'; return; }

    var html = '';
    // 読みかけの本（最近読んだ順）
    if (!q) {
      var reading = books.map(function (b) { return { b: b, p: store.get('pos:' + b.id) }; })
        .filter(function (x) { return x.p && x.p.t && x.p.pct < 0.995; })
        .sort(function (a, c) { return c.p.t - a.p.t; }).slice(0, 6);
      if (reading.length && books.length > 6) {
        html += '<div class="section-title">読みかけ</div><div class="grid">' + reading.map(function (x) { return card(x.b); }).join('') + '</div>';
      }
    }
    var cur = null, open = false, multi = books.some(function (b) { return b.folder; });
    list.forEach(function (b) {
      if (b.folder !== cur) {
        if (open) html += '</div>';
        if (multi || html) html += '<div class="section-title">' + esc(b.folder || 'すべての本') + '</div>';
        html += '<div class="grid">'; open = true; cur = b.folder;
      }
      html += card(b);
    });
    if (open) html += '</div>';
    body.innerHTML = html;
  }

  $('shelf-body').addEventListener('click', function (e) {
    var el = e.target.closest('.book');
    if (el) location.hash = 'book/' + el.getAttribute('data-id');
  });
  $('search').addEventListener('input', renderShelf);
  $('refresh-btn').addEventListener('click', function () { loadShelf(true); });

  function loadShelf(force) {
    if (force) $('shelf-body').innerHTML = '<div class="center-msg"><div class="spinner"></div>本棚を読み込んでいます…</div>';
    return fetch('books.json', { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error('books.json を読み込めませんでした（' + r.status + '）');
      return r.json();
    }).then(function (res) {
      books = res.books || [];
      $('search').classList.toggle('hidden', books.length < 8);
      renderShelf();
    }).catch(function (e) {
      $('shelf-body').innerHTML = '<div class="center-msg">本棚を読み込めませんでした。<br>' + esc(e.message || e) + '</div>';
      throw e;
    });
  }

  // ---------- 読書 ----------
  var settings = Object.assign({ fontSize: 100, family: 'book', lh: '', theme: 'light' }, store.get('settings', {}));
  if (!store.get('settings') && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) settings.theme = 'dark';

  var THEMES = {
    light: { body: { color: '#222222 !important', background: '#ffffff !important' }, a: { color: '#8a5a2b !important' } },
    sepia: { body: { color: '#3b3024 !important', background: '#f5ecd9 !important' }, a: { color: '#8a5a2b !important' } },
    dark:  { body: { color: '#d8d5cf !important', background: '#18181a !important' }, a: { color: '#d9a46c !important' }, 'p, div, span, h1, h2, h3, h4, li': { color: 'inherit !important' } }
  };
  var FAMILIES = {
    gothic: '-apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif',
    mincho: '"Hiragino Mincho ProN", "Yu Mincho", YuMincho, "Noto Serif JP", "BIZ UDPMincho", serif'
  };

  var book = null, rendition = null, currentId = null, locationsReady = false, flatToc = [], openSeq = 0, pushedFromShelf = false;

  function setLoading(text, ratio) {
    $('loading').classList.remove('hidden');
    $('loading-text').textContent = text;
    $('loading-bar').style.width = Math.round((ratio || 0) * 100) + '%';
  }

  // 進み具合を表示しながらダウンロード
  function download(b, seq) {
    return fetch(b.file).then(function (r) {
      if (!r.ok) throw new Error('ファイルを取得できませんでした（' + r.status + '）');
      var total = +r.headers.get('Content-Length') || b.size || 0;
      if (!r.body || !r.body.getReader || !total) return r.arrayBuffer();
      var reader = r.body.getReader(), chunks = [], got = 0;
      return (function pump() {
        return reader.read().then(function (res) {
          if (res.done) {
            var buf = new Uint8Array(got), off = 0;
            chunks.forEach(function (c) { buf.set(c, off); off += c.length; });
            return buf.buffer;
          }
          chunks.push(res.value); got += res.value.length;
          if (seq === openSeq) setLoading('本を読み込んでいます… ' + Math.min(99, Math.round(got / total * 100)) + '%', got / total);
          return pump();
        });
      })();
    });
  }

  function openBook(id) {
    var b = byId(id);
    if (!b) { location.hash = ''; return; }
    closeBook();
    var seq = ++openSeq;
    currentId = id;
    $('r-title').textContent = titleOf(b);
    $('chap').textContent = ''; $('pct').textContent = '';
    $('slider').disabled = true; $('slider').value = 0;
    $('shelf').classList.add('hidden');
    $('reader').classList.remove('hidden');
    document.body.classList.add('reading');
    document.title = titleOf(b);
    applyChrome();
    setLoading('本を開いています…', 0);

    download(b, seq).then(function (data) {
      if (seq !== openSeq) return;
      setLoading('ページを準備しています…', 1);
      book = ePub(data);
      rendition = book.renderTo('viewer', {
        width: '100%', height: '100%', flow: 'paginated', spread: 'auto', minSpreadWidth: 900, allowScriptedContent: false
      });
      Object.keys(THEMES).forEach(function (k) { rendition.themes.register(k, THEMES[k]); });
      applySettings();
      bindRenditionEvents();

      var pos = store.get('pos:' + id);
      var target = pos && pos.cfi && pos.version === b.version ? pos.cfi : undefined;
      return rendition.display(target).catch(function () { return rendition.display(); }).then(function () {
        if (seq !== openSeq) return;
        $('loading').classList.add('hidden');
        book.loaded.navigation.then(function (nav) { if (seq === openSeq) buildToc(nav.toc); });
        // 全体の何％かを計算（少し時間がかかるので後から）
        var cacheKey = 'loc:' + id + ':' + b.version;
        var saved = null;
        try { saved = sessionStorage.getItem(cacheKey); } catch (e) {}
        var p = saved ? Promise.resolve(book.locations.load(saved)) : book.ready.then(function () { return book.locations.generate(1200); });
        p.then(function () {
          if (seq !== openSeq) return;
          if (!saved) { try { sessionStorage.setItem(cacheKey, book.locations.save()); } catch (e) {} }
          locationsReady = true;
          $('slider').disabled = false;
          var loc = rendition.currentLocation();
          if (loc && loc.start) onRelocated(loc);
        });
      });
    }).catch(function (e) {
      if (seq !== openSeq) return;
      toast('本を開けませんでした：' + (e.message || e));
      location.hash = '';
    });
  }

  function closeBook() {
    openSeq++;
    if (book) { try { book.destroy(); } catch (e) {} }
    book = null; rendition = null; locationsReady = false; flatToc = [];
    $('viewer').innerHTML = '';
    $('toc-list').innerHTML = '';
    closePanels();
  }

  function showShelf() {
    closeBook(); currentId = null;
    $('reader').classList.add('hidden');
    $('shelf').classList.remove('hidden');
    document.body.classList.remove('reading');
    document.title = '本棚';
    renderShelf();
  }

  function onRelocated(loc) {
    if (!loc || !loc.start || !currentId) return;
    var b = byId(currentId), cfi = loc.start.cfi, pct;
    var prev = store.get('pos:' + currentId) || {};
    if (locationsReady) {
      pct = loc.atEnd ? 1 : (book.locations.percentageFromCfi(cfi) || 0);
      $('pct').textContent = Math.round(pct * 100) + '%';
      $('slider').value = Math.round(pct * 1000);
    } else {
      pct = prev.pct || 0;
    }
    store.set('pos:' + currentId, { cfi: cfi, pct: pct, t: Date.now(), version: b && b.version });
    $('chap').textContent = chapterLabel(loc.start.href);
  }

  function chapterLabel(href) {
    if (!href) return '';
    var base = href.split('#')[0], hit = '';
    for (var i = 0; i < flatToc.length; i++) {
      var h = flatToc[i].href.split('#')[0];
      if (h && (h === base || base.slice(-h.length) === h || h.slice(-base.length) === base)) { hit = flatToc[i].label; break; }
    }
    return hit;
  }

  function buildToc(toc) {
    flatToc = [];
    var html = '';
    (function walk(items, depth) {
      (items || []).forEach(function (it) {
        var label = (it.label || '').trim();
        flatToc.push({ href: it.href || '', label: label });
        html += '<button data-href="' + esc(it.href) + '" style="padding-left:' + (10 + depth * 16) + 'px">' + esc(label) + '</button>';
        walk(it.subitems, depth + 1);
      });
    })(toc, 0);
    $('toc-list').innerHTML = html || '<div class="center-msg" style="padding:30px 10px">この本には目次がありません。</div>';
    var loc = rendition && rendition.currentLocation();
    if (loc && loc.start) $('chap').textContent = chapterLabel(loc.start.href);
  }

  $('toc-list').addEventListener('click', function (e) {
    var el = e.target.closest('button[data-href]');
    if (!el || !rendition) return;
    rendition.display(el.getAttribute('data-href'));
    closePanels();
  });

  var lastSwipe = 0;
  function bindRenditionEvents() {
    rendition.on('relocated', onRelocated);
    rendition.on('keyup', onKey);

    // タップ：左側で前へ、右側で次へ
    rendition.on('click', function (e) {
      if (e.target && e.target.closest && e.target.closest('a')) return;
      var sel = e.view && e.view.getSelection && e.view.getSelection();
      if (sel && String(sel).length) return;
      if (Date.now() - lastSwipe < 500) return;
      var frame = e.view && e.view.frameElement;
      var wrap = $('viewer').getBoundingClientRect();
      var x = frame ? frame.getBoundingClientRect().left + e.clientX - wrap.left : e.clientX - wrap.left;
      var r = x / wrap.width;
      if (r < 0.3) prev(); else if (r > 0.7) next();
    });

    // スワイプ
    var sx = 0, sy = 0, st = 0;
    rendition.on('touchstart', function (e) { var t = e.changedTouches[0]; sx = t.screenX; sy = t.screenY; st = Date.now(); });
    rendition.on('touchend', function (e) {
      var t = e.changedTouches[0], dx = t.screenX - sx, dy = t.screenY - sy;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5 && Date.now() - st < 800) {
        lastSwipe = Date.now();
        if (dx < 0) next(); else prev();
      }
    });
  }

  function next() { if (rendition) rendition.next(); }
  function prev() { if (rendition) rendition.prev(); }
  function onKey(e) {
    if (!rendition || !currentId) return;
    if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName) && e.target.id !== 'slider') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === ' ' && !e.shiftKey)) next();
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || (e.key === ' ' && e.shiftKey)) prev();
    else if (e.key === 'Escape') closePanels();
  }
  document.addEventListener('keyup', onKey);
  $('prev-btn').addEventListener('click', prev);
  $('next-btn').addEventListener('click', next);

  $('slider').addEventListener('change', function () {
    if (!locationsReady) return;
    var cfi = book.locations.cfiFromPercentage(this.value / 1000);
    if (cfi) rendition.display(cfi);
  });
  $('slider').addEventListener('input', function () { $('pct').textContent = Math.round(this.value / 10) + '%'; });

  // ---------- 表示設定 ----------
  function each(sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
  function applyChrome() {
    $('reader').setAttribute('data-theme', settings.theme);
    $('font-val').textContent = settings.fontSize + '%';
    each('#theme-seg button', function (b) { b.classList.toggle('on', b.getAttribute('data-t') === settings.theme); });
    each('#family-seg button', function (b) { b.classList.toggle('on', b.getAttribute('data-v') === settings.family); });
    each('#lh-seg button', function (b) { b.classList.toggle('on', b.getAttribute('data-v') === settings.lh); });
  }
  function applySettings() {
    store.set('settings', settings);
    applyChrome();
    if (!rendition) return;
    var t = rendition.themes;
    t.select(settings.theme);
    t.fontSize(settings.fontSize + '%');
    if (settings.family === 'book') t.removeOverride('font-family'); else t.override('font-family', FAMILIES[settings.family], true);
    if (settings.lh) t.override('line-height', settings.lh, true); else t.removeOverride('line-height');
  }
  $('font-down').addEventListener('click', function () { settings.fontSize = Math.max(70, settings.fontSize - 10); applySettings(); });
  $('font-up').addEventListener('click', function () { settings.fontSize = Math.min(220, settings.fontSize + 10); applySettings(); });
  $('theme-seg').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { settings.theme = b.getAttribute('data-t'); applySettings(); } });
  $('family-seg').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { settings.family = b.getAttribute('data-v'); applySettings(); } });
  $('lh-seg').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { settings.lh = b.getAttribute('data-v'); applySettings(); } });

  // ---------- パネル ----------
  function closePanels() { ['scrim', 'toc-panel', 'settings-panel'].forEach(function (k) { $(k).classList.add('hidden'); }); }
  function togglePanel(id) {
    var wasOpen = !$(id).classList.contains('hidden');
    closePanels();
    if (wasOpen) return;
    $('scrim').classList.remove('hidden'); $(id).classList.remove('hidden');
    if (id === 'toc-panel') {
      var cur = $('chap').textContent;
      each('#toc-list button', function (b) {
        var on = !!cur && b.textContent.trim() === cur; b.classList.toggle('current', on);
        if (on) b.scrollIntoView({ block: 'center' });
      });
    }
  }
  $('toc-btn').addEventListener('click', function () { togglePanel('toc-panel'); });
  $('settings-btn').addEventListener('click', function () { togglePanel('settings-panel'); });
  $('scrim').addEventListener('click', closePanels);
  $('back-btn').addEventListener('click', function () {
    if (pushedFromShelf) history.back(); else location.hash = '';
  });

  // ---------- 画面の切り替え（URLの #book/ID で本を開く） ----------
  function route() {
    var m = location.hash.match(/^#book\/([\w-]+)/);
    if (m) {
      if (m[1] !== currentId) openBook(m[1]);
    } else if (currentId || !$('reader').classList.contains('hidden')) {
      pushedFromShelf = false;
      showShelf();
    }
  }
  window.addEventListener('hashchange', function () {
    if (/^#book\//.test(location.hash) && !currentId) pushedFromShelf = true;
    route();
  });

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { if (rendition) { try { rendition.resize(); } catch (e) {} } }, 250);
  });

  // ---------- 起動 ----------
  loadShelf(false).then(route, function () {});
})();
</script>
</body>
</html>
