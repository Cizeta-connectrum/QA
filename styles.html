<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background-color: #f5f7fa;
    color: #333;
}

.app-container {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
}

/* Header */
.header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 1rem 2rem;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    z-index: 100;
}

.header-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
}

.app-title {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: -0.5px;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 2rem;
}

.user-info {
    display: flex;
    align-items: center;
    gap: 1rem;
}

.user-name {
    font-size: 0.9rem;
    opacity: 0.95;
}

.language-select {
    background: rgba(255, 255, 255, 0.2);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: 0.5rem 0.75rem;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.85rem;
}

.language-select option {
    background: #333;
    color: white;
}

/* Main Layout */
.main-content {
    display: flex;
    flex: 1;
    overflow: hidden;
}

.sidebar {
    width: 250px;
    background: white;
    border-right: 1px solid #e1e8ed;
    overflow-y: auto;
    padding: 1rem 0;
}

.nav-menu {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.nav-item {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.5rem;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    color: #555;
    transition: all 0.3s ease;
    text-align: left;
}

.nav-item:hover {
    background: #f0f2f5;
    color: #667eea;
}

.nav-item.active {
    background: #f0f2f5;
    color: #667eea;
    border-left: 4px solid #667eea;
    padding-left: calc(1.5rem - 4px);
}

.nav-icon {
    font-size: 1.2rem;
}

.nav-label {
    font-weight: 500;
}

.content-area {
    flex: 1;
    overflow-y: auto;
    padding: 2rem;
    background: #f5f7fa;
}

.section {
    display: none;
    animation: fadeIn 0.3s ease;
}

.section.active {
    display: block;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
    gap: 1rem;
}

.section-header h2 {
    font-size: 1.5rem;
    color: #333;
}

/* Meetings Section */
.meetings-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.5rem;
}

.meeting-card {
    background: white;
    border-radius: 8px;
    padding: 1.5rem;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    cursor: pointer;
    transition: all 0.3s ease;
}

.meeting-card:hover {
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    transform: translateY(-2px);
}

.meeting-card h3 {
    font-size: 1.1rem;
    margin-bottom: 0.5rem;
    color: #667eea;
}

.meeting-card-date {
    color: #999;
    font-size: 0.85rem;
    margin-bottom: 0.5rem;
}

.meeting-card-desc {
    color: #666;
    font-size: 0.9rem;
    margin-bottom: 1rem;
    max-height: 60px;
    overflow: hidden;
    text-overflow: ellipsis;
}

.meeting-card-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: #999;
}

/* Meeting Detail */
.meeting-detail-container {
    background: white;
    border-radius: 8px;
    padding: 2rem;
    margin-bottom: 2rem;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

.meeting-info {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 2rem;
    margin-bottom: 2rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid #e1e8ed;
}

.info-block {
    display: flex;
    flex-direction: column;
}

.info-block label {
    font-weight: 600;
    color: #667eea;
    margin-bottom: 0.5rem;
    font-size: 0.9rem;
}

.info-block p {
    color: #555;
    line-height: 1.6;
}

.meeting-notes-section h3 {
    margin-bottom: 1rem;
    color: #333;
}

.notes-textarea {
    width: 100%;
    min-height: 150px;
    padding: 1rem;
    border: 1px solid #e1e8ed;
    border-radius: 4px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 0.95rem;
    resize: vertical;
    margin-bottom: 1rem;
}

/* Conversations */
.conversations-section {
    background: white;
    border-radius: 8px;
    padding: 2rem;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

.conversation-tabs {
    display: flex;
    gap: 1rem;
    margin-bottom: 2rem;
    border-bottom: 1px solid #e1e8ed;
}

.tab-button {
    padding: 0.75rem 1rem;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 0.95rem;
    color: #999;
    border-bottom: 3px solid transparent;
    transition: all 0.3s ease;
}

.tab-button:hover {
    color: #667eea;
}

.tab-button.active {
    color: #667eea;
    border-bottom-color: #667eea;
}

.conversation-input {
    margin-bottom: 2rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid #e1e8ed;
}

.input-textarea {
    width: 100%;
    min-height: 100px;
    padding: 1rem;
    border: 1px solid #e1e8ed;
    border-radius: 4px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 0.95rem;
    resize: vertical;
    margin-bottom: 1rem;
}

.input-actions {
    display: flex;
    gap: 1rem;
    align-items: center;
}

.type-select {
    padding: 0.75rem;
    border: 1px solid #e1e8ed;
    border-radius: 4px;
    font-size: 0.95rem;
    background: white;
    cursor: pointer;
}

.conversations-list {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

.conversation-item {
    background: #f9fafb;
    border-left: 4px solid #667eea;
    padding: 1.5rem;
    border-radius: 4px;
}

.conversation-item.question {
    border-left-color: #fbbf24;
}

.conversation-item.comment {
    border-left-color: #10b981;
}

.conversation-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 0.75rem;
}

.conversation-meta {
    display: flex;
    gap: 0.5rem;
    align-items: center;
}

.conversation-type {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 600;
    padding: 0.25rem 0.5rem;
    border-radius: 3px;
    text-transform: uppercase;
    background: #667eea;
    color: white;
}

.conversation-type.question {
    background: #fbbf24;
    color: #000;
}

.conversation-type.comment {
    background: #10b981;
}

.conversation-author {
    font-weight: 600;
    color: #333;
    font-size: 0.95rem;
}

.conversation-time {
    color: #999;
    font-size: 0.85rem;
}

.conversation-content {
    color: #555;
    line-height: 1.6;
    word-break: break-word;
    white-space: pre-wrap;
}

.conversation-actions {
    display: flex;
    gap: 1rem;
    margin-top: 1rem;
}

.like-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #999;
    font-size: 0.9rem;
    transition: color 0.3s;
}

.like-btn:hover {
    color: #667eea;
}

.like-btn.liked {
    color: #f87171;
}

/* Search Section */
.search-box {
    display: flex;
    gap: 1rem;
    margin-bottom: 1.5rem;
}

.search-input {
    flex: 1;
    padding: 0.75rem 1rem;
    border: 1px solid #e1e8ed;
    border-radius: 4px;
    font-size: 0.95rem;
}

.search-filters {
    display: flex;
    gap: 1rem;
    margin-bottom: 2rem;
    align-items: center;
}

.search-filters label {
    font-weight: 600;
}

.search-filters select {
    padding: 0.75rem;
    border: 1px solid #e1e8ed;
    border-radius: 4px;
    background: white;
}

.search-results {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.search-result-item {
    background: white;
    padding: 1.5rem;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

.search-result-item p {
    margin: 0.5rem 0;
    color: #666;
    font-size: 0.9rem;
}

/* Buttons */
.btn {
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 500;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
}

.btn-primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
}

.btn-secondary {
    background: #e1e8ed;
    color: #555;
}

.btn-secondary:hover {
    background: #d1d8df;
}

.btn-back {
    background: none;
    border: none;
    color: #667eea;
    padding: 0;
    margin-right: 1rem;
}

.btn-back:hover {
    text-decoration: underline;
}

/* Modal */
.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.modal-content {
    background: white;
    border-radius: 8px;
    width: 90%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem;
    border-bottom: 1px solid #e1e8ed;
}

.modal-header h2 {
    font-size: 1.3rem;
}

.close-btn {
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: #999;
    padding: 0;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.close-btn:hover {
    color: #333;
}

.modal-body {
    padding: 1.5rem;
}

.modal-footer {
    padding: 1.5rem;
    border-top: 1px solid #e1e8ed;
    display: flex;
    justify-content: flex-end;
    gap: 1rem;
}

/* Forms */
.form-group {
    margin-bottom: 1.5rem;
}

.form-group label {
    display: block;
    font-weight: 600;
    margin-bottom: 0.5rem;
    color: #333;
}

.form-input,
.form-textarea {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid #e1e8ed;
    border-radius: 4px;
    font-size: 0.95rem;
    font-family: inherit;
}

.form-textarea {
    min-height: 100px;
    resize: vertical;
}

.form-input:focus,
.form-textarea:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

/* Settings */
.settings-container {
    background: white;
    border-radius: 8px;
    padding: 2rem;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    max-width: 500px;
}

.setting-item {
    margin-bottom: 1.5rem;
    display: flex;
    flex-direction: column;
}

.setting-item label {
    font-weight: 600;
    margin-bottom: 0.5rem;
    color: #333;
}

.setting-item select {
    padding: 0.75rem;
    border: 1px solid #e1e8ed;
    border-radius: 4px;
    font-size: 0.95rem;
}

/* Responsive Design */
@media (max-width: 768px) {
    .header-content {
        flex-direction: column;
        gap: 1rem;
    }

    .main-content {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #e1e8ed;
        overflow-x: auto;
        overflow-y: visible;
        padding: 0;
    }

    .nav-menu {
        flex-direction: row;
        overflow-x: auto;
    }

    .nav-item {
        flex-shrink: 0;
        white-space: nowrap;
    }

    .content-area {
        padding: 1rem;
    }

    .section-header {
        flex-direction: column;
        align-items: flex-start;
    }

    .meetings-list {
        grid-template-columns: 1fr;
    }

    .meeting-detail-container {
        padding: 1rem;
    }

    .meeting-info {
        grid-template-columns: 1fr;
        gap: 1rem;
    }

    .input-actions {
        flex-direction: column;
    }

    .modal-content {
        width: 95%;
        max-height: 80vh;
    }
}

/* Scrollbar Styling */
::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

::-webkit-scrollbar-track {
    background: #f1f1f1;
}

::-webkit-scrollbar-thumb {
    background: #c1c1c1;
    border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
    background: #888;
}
</style>
